# Challenge: a Service without a selector + an Endpoints object you write yourself.
# Kubernetes does not manage these endpoints; you do.
# Replace the address with any IP that serves HTTP on port 80
# (for example another machine on your network).
# kubectl prints "v1 Endpoints is deprecated": expected, see the slide
# "From Endpoints to EndpointSlices".
apiVersion: v1
kind: Service
metadata:
  name: outside
spec:                       # no selector!
  ports:
  - name: http
    port: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: outside             # same name as the Service: that's the link
subsets:
- addresses:
  - ip: 1.1.1.1
  ports:
  - name: http              # must match the Service port name
    port: 80
