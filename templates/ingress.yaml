# Ingress: HTTP routing by host and path. Needs an Ingress controller installed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app
spec:
  ingressClassName: traefik       # which controller handles it
  tls:
  - hosts: ["my-app.example.com"]
    secretName: my-app-tls
  rules:
  - host: my-app.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: my-app
            port: { number: 80 }
