apiVersion: v1
kind: ConfigMap
metadata:
  name: my-app-config
data:
  LOG_LEVEL: info
  app.yaml: |
    featureFlags:
      search: true
---
# base64 is encoding, not encryption. Protect Secrets with RBAC and encryption at rest;
# in production consider External Secrets Operator or Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: my-app-secret
type: Opaque
stringData:
  DB_PASSWORD: change-me
