# Two ways to give something outside the cluster an in-cluster name.

# 1) ExternalName: a DNS CNAME. Use when the target has a DNS name.
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  type: ExternalName
  externalName: pg.prod.example.com
---
# 2) Custom endpoints: a Service without a selector + an Endpoints object you manage.
#    Use when you only have IPs (VMs, on-prem). No health checks: keep the list up to date.
#    kubectl warns that v1 Endpoints is deprecated; the slide
#    "From Endpoints to EndpointSlices" shows how to migrate.
apiVersion: v1
kind: Service
metadata:
  name: legacy-db
spec:
  ports:
  - name: pg
    port: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: legacy-db           # same name as the Service: that's the link
subsets:
- addresses:
  - ip: 10.0.5.20
  - ip: 10.0.5.21
  ports:
  - name: pg                # must match the Service port name
    port: 5432
