# Two ways to give something outside the cluster an in-cluster name.

# 1) ExternalName: a DNS CNAME. Use when the target has a DNS name.
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  type: ExternalName
  externalName: pg.prod.example.com
---
# 2) Custom endpoints: a Service without a selector + an EndpointSlice you manage.
#    Use when you only have IPs (VMs, on-prem). No health checks: keep the list up to date.
apiVersion: v1
kind: Service
metadata:
  name: legacy-db
spec:
  ports:
  - name: pg
    port: 5432
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: legacy-db-1
  labels:
    kubernetes.io/service-name: legacy-db
    endpointslice.kubernetes.io/managed-by: my-team
addressType: IPv4
ports:
- name: pg                  # must match the Service port name
  port: 5432
  protocol: TCP
endpoints:
- addresses: ["10.0.5.20"]
- addresses: ["10.0.5.21"]
