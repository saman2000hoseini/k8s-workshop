apiVersion: v1
kind: Namespace
metadata:
  name: c6
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: c6
---
# The CI pipeline runs as the deployer ServiceAccount and must be able to
# read, create and update Deployments in c6. Nothing more.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: c6
rules:
- apiGroups: [""]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: c6
subjects:
- kind: ServiceAccount
  name: deploy-bot
  namespace: c6
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
