apiVersion: v1
kind: Namespace
metadata:
  name: c1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: c1
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
      - name: api
        image: nginx:1.27
        resources:
          requests:
            cpu: "64"
            memory: 64Mi
          limits:
            memory: 128Mi
