apiVersion: v1
kind: Namespace
metadata:
  name: c3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: c3
spec:
  replicas: 2
  selector:
    matchLabels: { app: shop }
  template:
    metadata:
      labels: { app: shop }
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: c3
spec:
  selector:
    app: shop
  ports:
  - port: 80
    targetPort: 8080
