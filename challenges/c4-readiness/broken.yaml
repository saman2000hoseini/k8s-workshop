apiVersion: v1
kind: Namespace
metadata:
  name: c4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: c4
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: { path: /healthz, port: 80 }
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: c4
spec:
  selector:
    app: web
  ports:
  - port: 80
