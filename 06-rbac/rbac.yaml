apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci
  namespace: shop
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: shop
rules:
- apiGroups: [""]               # "" = the core API group
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-pods
  namespace: shop
subjects:
- kind: ServiceAccount
  name: ci
  namespace: shop
roleRef:                        # cannot be changed later
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
